<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Page</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'blog/style.css' %}" />
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
</head>

<body>
    <h1>Chatbot App</h1>
    <div>
        <div id="chatbot">
            <p class="botText"><span>Hi there</span> </p>
        </div>
        <div id="userInput">
            <input id="textInput" type="text" name="userMessage" placeholder="Type a message..." />
            <input type="submit" id="buttonInput" value="Send" />
        </div>
    </div>
    <script>
        function getUserResponse() {
            var userText = $("#textInput").val();
            var userHtml = '<p class="userText">User: <span>' + userText + '</span></p>';
            $("#textInput").val("");
            $("#chatbot").append(userHtml);
            $.get('/blog/getResponse', { userMessage: userText }).done(function (data) {
                var botHtml = '<p class="botText">ChatBot: <span>' + data + '</span></p>';
                $("#chatbot").append(botHtml);
            });
        }
        $("#buttonInput").click(function () {
            getUserResponse();
        });
    </script>
</body>

</html>
